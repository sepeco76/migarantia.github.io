<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi garantía</title>
<meta name="description" content="Garantías, manuales y seguros de tus compras, siempre a mano.">
<meta name="theme-color" content="#0f6e56">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #f7f6f2; --card: #ffffff; --text: #1f1e1b; --muted: #6b6a64; --line: #e4e2da; --soft: #f1efe8;
    --accent: #0f6e56; --accent-text: #ffffff; --link: #0f6e56;
    --ok: #1d9e75; --warn: #9a5f10; --warn-bg: #faeeda; --bad: #a32d2d; --bad-bg: #fcebeb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161614; --card: #22221f; --text: #f1efe8; --muted: #b4b2a9; --line: #3a3935; --soft: #2c2c2a;
            --accent: #1d9e75; --link: #5dcaa5; --ok: #5dcaa5; --warn: #ef9f27; --warn-bg: #412402; --bad: #f09595; --bad-bg: #501313; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); font-size: 16px; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 16px 8px; display: flex; align-items: center; gap: 8px; }
  header h1 { font-size: 20px; font-weight: 600; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icono-btn { border: none; background: none; font-size: 22px; color: var(--text); padding: 4px 6px; line-height: 1; }
  main { padding: 0 16px 150px; max-width: 640px; margin: 0 auto; }
  nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  nav a { flex: 1; text-align: center; padding: 9px 0 10px; font-size: 12px; color: var(--muted); text-decoration: none; }
  nav a span { display: block; font-size: 20px; }
  nav a.activo { color: var(--link); font-weight: 600; }
  .fab { position: fixed; left: 16px; right: 16px; bottom: calc(70px + env(safe-area-inset-bottom)); max-width: 608px; margin: 0 auto; z-index: 4;
         background: var(--accent); color: var(--accent-text); border: none; border-radius: 14px; padding: 14px; font-size: 17px; font-weight: 600; }
  .primario { width: 100%; background: var(--accent); color: var(--accent-text); border: none; border-radius: 14px; padding: 14px; font-size: 17px; font-weight: 600; margin-top: 18px; }
  .buscador { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); font-size: 16px; margin-bottom: 8px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 4px; }
  .chip { flex: none; border: 1px solid var(--line); background: var(--card); color: var(--muted); border-radius: 18px; padding: 6px 12px; font-size: 14px; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .lista { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; margin-bottom: 10px; }
  .item { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-top: 1px solid var(--line); }
  .item:first-child { border-top: none; }
  .item.click { cursor: pointer; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; flex: none; position: relative; }
  .insignia { position: absolute; right: -4px; bottom: -4px; width: 20px; height: 20px; border-radius: 50%; background: var(--card); border: 1px solid var(--line); font-size: 11px; display: flex; align-items: center; justify-content: center; }
  .estado { display: flex; align-items: center; gap: 4px; flex: none; }
  .punto { width: 12px; height: 12px; border-radius: 50%; }
  .punto.completa { background: var(--ok); }
  .punto.parcial { border: 2px solid var(--ok); background: linear-gradient(90deg, var(--ok) 50%, transparent 50%); }
  .punto.sin { border: 2px solid var(--muted); }
  .paraguas { font-size: 15px; filter: grayscale(1); opacity: .4; }
  .paraguas.on { filter: none; opacity: 1; }
  .texto { flex: 1; min-width: 0; }
  .titulo { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .urgente { color: var(--warn) !important; }
  .vencido { color: var(--bad) !important; }
  .fecha { font-size: 13px; color: var(--muted); flex: none; text-align: right; }
  .mini { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 8px; padding: 5px 9px; font-size: 14px; flex: none; text-decoration: none; }
  .grupo { font-size: 13px; font-weight: 600; margin: 14px 2px 6px; color: var(--muted); }
  .grupo.atrasado { color: var(--bad); } .grupo.mes { color: var(--warn); }
  .vacio { text-align: center; padding: 40px 20px; color: var(--muted); }
  .vacio .grande { font-size: 44px; }
  .seccion { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 4px 14px 14px; margin-bottom: 12px; }
  .seccion h2 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 12px 0 4px; text-transform: uppercase; letter-spacing: .03em; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  label.check { display: flex; align-items: center; gap: 10px; font-size: 16px; color: var(--text); margin: 12px 0 4px; }
  label.check input { width: 22px; height: 22px; }
  input, select, textarea { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); font-size: 16px; font-family: inherit; }
  .dos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .oculto { display: none; }
  .fila { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .seccion h2 + .fila, .seccion .fila:first-child { border-top: none; }
  .fila > span:first-child { color: var(--muted); }
  .fila .valor { text-align: right; word-break: break-word; }
  .aviso { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 10px 12px; font-size: 14px; margin: 8px 0; }
  .info { background: var(--soft); border-radius: 10px; padding: 10px 12px; font-size: 14px; margin: 8px 0; }
  .boton { display: block; width: 100%; text-align: center; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--text); font-size: 16px; margin-top: 8px; text-decoration: none; }
  .boton.peligro { color: var(--bad); }
  .dosbotones { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .docs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
  .doc { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--soft); border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; color: var(--muted); text-align: center; cursor: pointer; }
  .doc img { width: 100%; height: 100%; object-fit: cover; }
  .doc .etq { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.55); color: #fff; font-size: 11px; padding: 3px; }
  .doc .pdf { font-size: 30px; }
  .docedit { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
  .docedit img, .docedit .pdfmini { width: 44px; height: 44px; object-fit: cover; border-radius: 8px; flex: none; background: var(--soft); display: flex; align-items: center; justify-content: center; }
  .repetible { border-top: 1px solid var(--line); padding-top: 4px; margin-top: 8px; }
  .quitar { background: none; border: none; color: var(--bad); font-size: 14px; padding: 6px 0; }
  .anadir { background: none; border: 1px dashed var(--line); color: var(--link); width: 100%; border-radius: 10px; padding: 10px; font-size: 15px; margin-top: 10px; }
  .visor { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.92); display: flex; flex-direction: column; }
  .visor img { flex: 1; min-height: 0; object-fit: contain; width: 100%; }
  .visor button { background: none; border: none; color: #fff; font-size: 17px; padding: 16px; text-align: right; }
  .copiar { border: none; background: none; color: var(--link); font-size: 14px; padding: 0 0 0 6px; }
  .pie { text-align: center; font-size: 12px; color: var(--muted); margin-top: 16px; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(140px + env(safe-area-inset-bottom)); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 30; }
</style>
</head>
<body>
<header>
  <button class="icono-btn" id="volver" hidden aria-label="Volver">←</button>
  <h1 id="tituloPantalla">Mi garantía</h1>
  <button class="icono-btn" id="ajustes" aria-label="Ajustes">⚙️</button>
</header>
<main id="app"></main>
<button class="fab" id="fab" hidden>＋ Nueva compra</button>
<nav id="nav">
  <a href="#/" data-ruta="inicio"><span>🏠</span>Inicio</a>
  <a href="#/agenda" data-ruta="agenda"><span>📅</span>Agenda</a>
  <a href="#/inactivos" data-ruta="inactivos"><span>🗄️</span>Inactivos</a>
</nav>
<script src="app.js"></script>
</body>
</html>
